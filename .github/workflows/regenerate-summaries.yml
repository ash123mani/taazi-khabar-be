name: Regenerate Summaries

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date in YYYY-MM-DD format (default: yesterday)'
        required: false
        type: string

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Regenerate summaries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NVIDIA_API_KEY: ${{ secrets.NIM_SUMMARIZER_API_KEY }}
        run: python -m app.scripts.regenerate_by_date ${{ github.event.inputs.date }}
